<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>📍 Aviso de Ubicación</title>
  <!-- Cargamos la librería desde CDN -->
  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: -apple-system, Roboto, sans-serif; margin: 0; 
           padding: 16px; background: #f0f2f5; color: #202124; }
    .card { background: white; border-radius: 14px; padding: 18px; 
            max-width: 560px; margin: 0 auto 16px; 
            box-shadow: 0 2px 10px rgba(0,0,0,.08); }
    h1 { font-size: 20px; margin: 0 0 12px; }
    input, button { width: 100%; padding: 15px; font-size: 17px; 
                    border-radius: 10px; border: 1px solid #ccc; 
                    margin: 6px 0; }
    button { background: #1a73e8; color: white; border: none; 
             font-weight: bold; cursor: pointer; }
    button:active { background: #0d47a1; }
    .btn-camera { background: #34a853; margin-top: 4px; }
    .btn-camera:active { background: #1e7e34; }
    .btn-stop { background: #ea4335; }
    .btn-stop:active { background: #c5221f; }
    
    /* Estilos del contenedor del escáner */
    #reader { width: 100%; border-radius: 10px; overflow: hidden; 
              background: #000; margin-bottom: 10px; display: none; }
    
    #resultado { display: none; }
    .local { font-size: 20px; font-weight: bold; color: #1a73e8; 
             margin-bottom: 6px; }
    .total { color: #5f6368; margin-bottom: 14px; font-size: 15px; }
    .ubicacion { background: #e8f0fe; border-left: 5px solid #1a73e8; 
                 padding: 12px 14px; border-radius: 8px; margin: 8px 0; }
    .ubicacion .titulo { font-size: 18px; font-weight: bold; 
                         color: #0d47a1; }
    .ubicacion .detalle { font-size: 14px; color: #5f6368; margin-top: 4px; }
    .badge { display: inline-block; background: #1a73e8; color: white; 
             padding: 2px 10px; border-radius: 12px; font-size: 13px; 
             margin-left: 8px; }
    .error { background: #fce8e6; color: #c5221f; padding: 14px; 
             border-radius: 10px; }
    .caja-escaneada { background: #fff8e1; border-left: 5px solid #f9ab00; 
                      padding: 10px 14px; border-radius: 8px; 
                      margin-bottom: 14px; font-size: 14px; }
    .hint { font-size: 13px; color: #5f6368; margin-top: 8px; }
    .loader { text-align: center; padding: 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>📍 Aviso de Ubicación</h1>
    
    <!-- Contenedor del escáner (oculto inicialmente) -->
    <div id="reader"></div>
    
    <!-- Botones de control del escáner -->
    <button id="btn-start" class="btn-camera" onclick="startScanner()">
      📷 Abrir Cámara
    </button>
    <button id="btn-stop" class="btn-stop" onclick="stopScanner()" style="display:none;">
      ⏹️ Detener Cámara
    </button>
    
    <!-- Entrada manual (respaldo) -->
    <input id="codigo" placeholder="O escribe el código QR aquí" autocomplete="off">
    <button onclick="consultar()">🔍 BUSCAR UBICACIÓN</button>
    <div class="hint">Escanea cualquier caja del local para ver TODAS sus ubicaciones</div>
  </div>

  <div class="card" id="resultado"></div>

  <script>
    const API = 'https://script.google.com/macros/s/AKfycbwsadUhAZkLR6hH5R7mAFpC8FFjK-o69fxgzLTwWJdk8L6PuCh9Pi4wfVNsvzvKct3vzQ/exec';
    
    // Variables globales para el escáner
    let html5QrCode = null;
    let isScanning = false;
    let lastScanned = '';
    let lastScannedTime = 0;

    // --- LÓGICA DEL ESCÁNER ---

    async function startScanner() {
      // Si ya está escaneando, no hacer nada
      if (isScanning) return;

      const readerDiv = document.getElementById('reader');
      const btnStart = document.getElementById('btn-start');
      const btnStop = document.getElementById('btn-stop');
      
      readerDiv.style.display = 'block';
      btnStart.style.display = 'none';
      btnStop.style.display = 'block';

      // Inicializar instancia si no existe
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }

      const config = { 
        fps: 10, 
        qrbox: { width: 250, height: 250 },
        aspectRatio: 1.0,
        facingMode: "environment" // Forzar cámara trasera
      };

      try {
        // Usamos start() con el ID de la cámara trasera o 'environment'
        // Primero intentamos obtener las cámaras para elegir la trasera si está disponible
        const devices = await Html5Qrcode.getCameras();
        if (devices && devices.length) {
          // Buscar cámara trasera por label, si no, usar la primera
          const backCamera = devices.find(d => 
            d.label.toLowerCase().includes('back') || 
            d.label.toLowerCase().includes('trasera') ||
            d.label.toLowerCase().includes('rear')
          ) || devices[0];
          
          await html5QrCode.start(
            backCamera.id, 
            config,
            onScanSuccess,
            onScanError
          );
          isScanning = true;
        } else {
          throw new Error("No se encontraron cámaras.");
        }
      } catch (err) {
        console.error("Error al iniciar cámara:", err);
        // Mostrar mensaje de error en el lector
        readerDiv.innerHTML = `<div class="error">No se pudo acceder a la cámara. Asegúrate de dar permisos y usar HTTPS.</div>`;
        // Resetear botones
        btnStart.style.display = 'block';
        btnStop.style.display = 'none';
      }
    }

    async function stopScanner() {
      if (!html5QrCode || !isScanning) return;
      
      const btnStart = document.getElementById('btn-start');
      const btnStop = document.getElementById('btn-stop');
      const readerDiv = document.getElementById('reader');

      try {
        await html5QrCode.stop();
        html5QrCode.clear(); // Limpiar el área del lector
        readerDiv.style.display = 'none';
        readerDiv.innerHTML = ''; // Limpiar HTML interno
        
        btnStart.style.display = 'block';
        btnStop.style.display = 'none';
        isScanning = false;
      } catch (err) {
        console.error("Error al detener cámara:", err);
      }
    }

    // Callback al escanear exitosamente
    function onScanSuccess(decodedText, decodedResult) {
      // Evitar escaneos duplicados en ráfaga (debounce)
      const now = Date.now();
      if (decodedText === lastScanned && (now - lastScannedTime) < 3000) {
        return;
      }
      lastScanned = decodedText;
      lastScannedTime = now;

      // Feedback táctil y sonoro
      if (navigator.vibrate) navigator.vibrate(100);
      beep(true);

      // Consultar automáticamente
      consultar(decodedText);
      
      // Opcional: pausar el escáner para que el usuario lea el resultado
      // En este caso, detenemos la cámara tras 1 segundo para liberar recursos
      setTimeout(() => {
        stopScanner();
      }, 1000);
    }

    function onScanError(errorMessage) {
      // Silencioso, es normal que falle en cada frame hasta encontrar un código
    }

    // --- LÓGICA DE CONSULTA ---

    async function consultar(codigoEscaneado) {
      const codigo = codigoEscaneado || document.getElementById('codigo').value.trim();
      if (!codigo) return;

      const div = document.getElementById('resultado');
      div.style.display = 'block';
      div.innerHTML = '<div class="loader">⏳ Buscando...</div>';

      try {
        const res = await fetch(`${API}?codigo=${encodeURIComponent(codigo)}`);
        const data = await res.json();

        if (!data.ok) {
          div.innerHTML = `<div class="error">${data.msg}</div>`;
          beep(false);
          return;
        }

        // Renderizar éxito
        let html = `
          <div class="local">📍 ${data.local}</div>
          <div class="total">📦 ${data.totalCajas} cajas en ${data.ubicaciones.length} ubicación(es)</div>
          <div class="caja-escaneada">
            <b>Caja escaneada:</b> ${data.cajaEscaneada.codigo}<br>
            <b>Su ubicación:</b> Estante ${data.cajaEscaneada.estante} · 
            Nivel ${data.cajaEscaneada.nivel} · Posición ${data.cajaEscaneada.posicion}
          </div>
        `;

        data.ubicaciones.forEach(u => {
          html += `
            <div class="ubicacion">
              <div class="titulo">
                🗄️ Estante ${u.estante} · Nivel ${u.nivel}
                <span class="badge">${u.cantidad} cajas</span>
              </div>
              <div class="detalle">
                📦 Posiciones <b>${u.posDesde}</b> a <b>${u.posHasta}</b><br>
                🔖 Desde <b>${u.codigoInicio}</b> hasta <b>${u.codigoFin}</b>
              </div>
            </div>
          `;
        });

        div.innerHTML = html;
        // Vibración extra para confirmar lectura
        if (navigator.vibrate) navigator.vibrate(50);
        
        // Limpiar el campo de texto manual
        document.getElementById('codigo').value = '';

      } catch (err) {
        div.innerHTML = `<div class="error">Error de conexión: ${err.message}</div>`;
        beep(false);
      }
    }

    function beep(ok) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.frequency.value = ok ? 900 : 300;
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.15);
      } catch(e) {}
    }

    // Enter en el campo manual dispara la consulta
    document.getElementById('codigo').addEventListener('keypress', e => {
      if (e.key === 'Enter') consultar();
    });
  </script>
</body>
</html>
